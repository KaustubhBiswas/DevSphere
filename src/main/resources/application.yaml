spring:
  application:
    name: devsphere
  datasource:
    url: jdbc:postgresql://localhost:5432/DevSphere
    username: postgres
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

jwt:
  expiration: 86400000

